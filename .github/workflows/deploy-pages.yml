name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build PWA
        run: npx ng build --configuration production --base-href=/365-Savings/

      - name: SPA 404 fallback
        run: cp dist/365-savings/browser/index.html dist/365-savings/browser/404.html

      - name: Verify PWA artifacts
        run: |
          test -f dist/365-savings/browser/manifest.webmanifest
          test -f dist/365-savings/browser/ngsw-worker.js
          test -f dist/365-savings/browser/ngsw.json
          test -f dist/365-savings/browser/icons/icon-512x512.png
          test -f dist/365-savings/browser/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/365-savings/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
