name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build PWA
        run: npx ng build --configuration production --base-href=/365-Savings/

      - name: SPA 404 fallback
        run: cp dist/365-savings/browser/index.html dist/365-savings/browser/404.html

      - name: Verify PWA artifacts
        run: |
          test -f dist/365-savings/browser/manifest.webmanifest
          test -f dist/365-savings/browser/ngsw-worker.js
          test -f dist/365-savings/browser/ngsw.json
          test -f dist/365-savings/browser/icons/icon-192x192.png
          test -f dist/365-savings/browser/icons/icon-512x512.png
          test -f dist/365-savings/browser/icons/icon-512x512-maskable.png
          test -f dist/365-savings/browser/404.html
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('dist/365-savings/browser')
          m = json.loads((root / 'manifest.webmanifest').read_text())
          assert m.get('name') and m.get('short_name'), 'name/short_name missing'
          assert m.get('start_url'), 'start_url missing'
          assert m.get('display') in ('standalone', 'fullscreen', 'minimal-ui'), 'display must be standalone'
          icons = m.get('icons') or []
          sizes = {i.get('sizes') for i in icons}
          assert '192x192' in sizes and '512x512' in sizes, f'need 192 and 512 icons, got {sizes}'
          for i in icons:
              p = root / i['src']
              assert p.is_file(), f'missing icon {i["src"]}'
          html = (root / 'index.html').read_text()
          assert 'rel="manifest"' in html and 'manifest.webmanifest' in html
          print('PWA installability checks OK')
          PY

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/365-savings/browser
          force_orphan: true
